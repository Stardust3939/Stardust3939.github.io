<!DOCTYPE html>
<html>
<head>
    <title>Countdown Timer</title>
    <style>
        #clock {
            font-size: 48px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>距离2024年6月22日 19：30还有：</h1>
    <div id="clock"></div>
    <style>
        #clock {
            font-size: 48px;
            text-align: center;
        }
        h1 {
            text-align: center;
        }
    </style>

    <script>
        // Set the countdown date and time
        var countdownDate = new Date("June 22, 2024 19:30:00").getTime();

        // Update the countdown every second
        var countdownTimer = setInterval(function() {
            // Get the current date and time
            var now = new Date().getTime();

            // Calculate the remaining time
            var distance = countdownDate - now;

            // Calculate days, hours, minutes, and seconds
            var days = Math.floor(distance / (1000 * 60 * 60 * 24));
            var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            var seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // Display the countdown
            document.getElementById("clock").innerHTML = days + "d " + hours + "h " + minutes + "m " + seconds + "s ";

            // If the countdown is finished, display a message
            if (distance < 0) {
                clearInterval(countdownTimer);
                document.getElementById("clock").innerHTML = "开始发病！";
            }
        }, 1000);
    </script>

    <div style="text-align: center;">
        <a href="./home.html">Pubmed教学区</a>
    </div></div>
</body>
</html>
